unit_tests:
  - name: fact_orders_uses_customer_version_valid_at_order_time
    description: >
      A customer moved from bronze to gold on 2024-03-01. The January order must
      keep the bronze version's key and the June order must get the gold one;
      joining on the current version only would label both as gold.
    model: fact_orders
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: 7, order_date: "2024-01-15 10:00:00", order_total: 10}
          - {order_id: 2, customer_id: 7, order_date: "2024-06-15 10:00:00", order_total: 10}
      - input: ref('stg_order_items')
        rows:
          - {order_id: 1, order_item_id: 11, product_id: 1, quantity: 1, unit_price: 10, discount_amount: 0, gross_line_total: 10}
          - {order_id: 2, order_item_id: 21, product_id: 1, quantity: 1, unit_price: 10, discount_amount: 0, gross_line_total: 10}
      - input: ref('dim_customers')
        rows:
          - {customer_key: bronze_v1, customer_id: 7, customer_segment: bronze, effective_date: "1900-01-01 00:00:00", expiration_date: "2024-03-01 00:00:00", is_current: false}
          - {customer_key: gold_v2, customer_id: 7, customer_segment: gold, effective_date: "2024-03-01 00:00:00", expiration_date: "9999-12-31 00:00:00", is_current: true}
      - input: ref('dim_products')
        rows:
          - {product_key: p1, product_id: 1}
      - input: ref('dim_date')
        rows:
          - {date_key: 20240115, date_day: "2024-01-15"}
          - {date_key: 20240615, date_day: "2024-06-15"}
    expect:
      rows:
        - {order_id: 1, customer_key: bronze_v1}
        - {order_id: 2, customer_key: gold_v2}
