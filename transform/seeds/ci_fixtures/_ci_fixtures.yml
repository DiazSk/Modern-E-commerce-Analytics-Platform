version: 2

# Column types mirror scripts/init_db.sql and the loader DDL so CI sees the
# same types as the real source tables (seed type inference guesses wrong on
# microsecond timestamps and all-null columns).
seeds:
  - name: customers
    config:
      column_types:
        registration_date: date
        segment_start_date: date
        segment_end_date: date
        created_at: timestamp
        updated_at: timestamp
  - name: orders
    config:
      column_types:
        order_date: timestamp
        order_total: numeric(10,2)
        created_at: timestamp
        updated_at: timestamp
  - name: order_items
    config:
      column_types:
        unit_price: numeric(10,2)
        discount_amount: numeric(10,2)
        line_total: numeric(10,2)
        created_at: timestamp
  - name: clickstream_events
    config:
      column_types:
        user_id: varchar(255)
        event_timestamp: timestamp
        product_id: varchar(100)
        created_at: timestamp
  - name: products
    config:
      column_types:
        price: numeric(10,2)
        rating_rate: numeric(3,2)
        ingestion_timestamp: timestamp
        ingestion_date: date
        created_at: timestamp
