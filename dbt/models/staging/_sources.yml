version: 2

sources:
  - name: rees46
    # No `database:` here: dbt-spark rejects it. On Databricks the source
    # resolves in the target's catalog (workspace).
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: raw_events
        description: One row per REES46 event, written by the job's transform task.
        columns:
          - name: event_key
            data_tests: [unique, not_null]
          - name: event_type
            data_tests:
              - accepted_values:
                  arguments:
                    values: [view, cart, purchase]
