version: 2

models:
  - name: fct_sessions
    description: >
      One row per session (incremental, merge on user_session). With
      load_month set, rebuilds sessions starting on or after the day before
      that month, so sessions crossing into the loaded month are recomputed.
    columns:
      - name: user_session
        data_tests: [unique, not_null]
      - name: session_date
        data_tests: [not_null]

  - name: fct_purchases
    description: One row per purchase event (there are no order IDs in REES46).
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: user_session
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_sessions')
                field: user_session

  - name: dim_products
    description: Latest attributes per product (Type 1); price_band = price quartile within category_l1.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: price_band
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

  - name: dim_users
    columns:
      - name: user_id
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: mart_funnel_daily
    description: >
      Funnel per session day and top-level category. A session counts in a
      category if it has any event there; carted/purchased within that
      category under the funnel rule.
  - name: mart_cart_abandonment
    description: >
      Cart abandonment per category, price band and week. An item is a product
      carted in a session; abandoned if that session never purchases it.
      Purchases without a cart event are not counted as carted.

unit_tests:
  - name: fct_sessions_lookback_is_anchored_on_load_month
    model: fct_sessions
    overrides:
      macros:
        is_incremental: true
      vars:
        load_month: "2019-10"
    given:
      - input: this
        rows:
          - {user_session: already_loaded, session_date: 2019-11-20}
      - input: ref('int_sessions')
        rows:
          - {user_session: sept_last_day, session_date: 2019-09-30}
          - {user_session: sept_mid, session_date: 2019-09-15}
          - {user_session: october, session_date: 2019-10-12}
          - {user_session: november, session_date: 2019-11-20}
    expect:
      rows:
        - {user_session: sept_last_day}
        - {user_session: october}
        - {user_session: november}
