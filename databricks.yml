# Databricks Asset Bundle: the REES46 pipeline on Databricks Free Edition.
# Deploy:  databricks bundle deploy
# Run:     databricks bundle run rees46_pipeline --params month=2019-10
bundle:
  name: rees46

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition's default is "workspace")
    default: workspace
  schema:
    description: Schema holding the landing volume and tables
    default: rees46

  warehouse_id:
    description: SQL warehouse used by the dbt task
    lookup:
      warehouse: Serverless Starter Warehouse
  dbt_schema:
    description: Schema for dbt models (same catalog)
    default: rees46_dbt

targets:
  free:
    default: true
